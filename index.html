<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หุ่นยนต์ครูน้อย - เกมฝึกคิดเชิงคำนวณ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #122118;
            --board-bg: #1e3628;
            --text-light: #fdfbf7;
            --text-muted: #b0c4b8;
            --accent-yellow: #fcd53f;
            --accent-red: #ff5e5e;
            --accent-blue: #4db8ff;
            --accent-green: #3ded97;
            --block-bg: #2c4a38;
            --block-border: #466e57;
            --target-glow: rgba(252, 213, 63, 0.4);
            color-scheme: dark;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        h1, h2, h3, .mali-font {
            font-family: 'Mali', cursive;
        }

        /* Accessibility & Base Elements */
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        button:focus-visible, select:focus-visible {
            outline: 3px solid var(--accent-yellow);
            outline-offset: 2px;
        }

        button:active { transform: scale(0.96); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn-primary { background: var(--accent-green); color: #000; }
        .btn-primary:hover:not(:disabled) { background: #2fcc7f; }
        .btn-secondary { background: var(--block-bg); color: var(--text-light); border: 2px solid var(--block-border); }
        .btn-secondary:hover:not(:disabled) { border-color: var(--text-light); }
        .btn-danger { background: transparent; color: var(--accent-red); border: 1px solid var(--accent-red); padding: 4px 8px; font-size: 0.8rem;}
        .btn-danger:hover:not(:disabled) { background: var(--accent-red); color: #fff; }

        /* Layout */
        header {
            padding: 16px 5%;
            background: rgba(0,0,0,0.3);
            border-bottom: 2px solid var(--block-border);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        
        .level-selector { display: flex; gap: 8px; flex-wrap: wrap; }
        .level-btn { 
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--block-bg); color: var(--text-muted);
            border: 2px solid var(--block-border);
            display: flex; justify-content: center; align-items: center;
            font-family: 'Mali'; font-weight: bold;
        }
        .level-btn.unlocked { color: var(--text-light); border-color: var(--accent-blue); }
        .level-btn.active { background: var(--accent-blue); color: #000; }

        main {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            padding: 24px 5%;
            flex: 1;
        }

        @media(min-width: 900px) {
            main { grid-template-columns: 1fr 1fr; }
        }

        /* Left Panel */
        .panel {
            background: var(--board-bg);
            border-radius: 16px;
            padding: 20px;
            border: 2px solid var(--block-border);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .concept-tag {
            display: inline-block;
            background: rgba(77, 184, 255, 0.2);
            color: var(--accent-blue);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            align-self: flex-start;
        }

        #gameCanvas {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            background: var(--bg-dark);
            border: 4px solid var(--block-border);
            border-radius: 12px;
            margin: 0 auto;
            display: block;
        }

        .controls-row {
            display: flex; gap: 12px; flex-wrap: wrap;
            justify-content: center; align-items: center;
        }

        select {
            padding: 8px; border-radius: 8px;
            background: var(--block-bg); color: var(--text-light);
            border: 2px solid var(--block-border);
        }

        .status-box {
            padding: 12px; border-radius: 8px;
            text-align: center; font-weight: bold; min-height: 48px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.2);
        }
        .status-error { color: var(--accent-red); border: 1px solid var(--accent-red); }
        .status-success { color: var(--accent-green); border: 1px solid var(--accent-green); }

        /* Right Panel */
        .palette {
            display: flex; gap: 8px; flex-wrap: wrap;
            padding-bottom: 16px; border-bottom: 2px dashed var(--block-border);
        }
        
        .block-btn {
            background: var(--block-bg);
            border: 2px solid var(--accent-blue);
            color: var(--text-light);
            padding: 8px 12px; border-radius: 8px;
            font-size: 0.95rem; font-weight: 600;
        }
        .block-btn[data-type="LOOP_N"], .block-btn[data-type="LOOP_FLAG"] { border-color: var(--accent-yellow); }
        .block-btn[data-type="IF_WALL"] { border-color: var(--accent-red); }

        .workspace {
            flex: 1;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 16px;
            min-height: 250px;
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 8px;
        }

        .block-item {
            background: var(--block-bg);
            border: 1px solid var(--block-border);
            border-left: 4px solid var(--accent-blue);
            border-radius: 6px;
            padding: 8px;
            display: flex; flex-direction: column; gap: 8px;
            transition: transform 0.1s;
        }
        .block-item.is-loop { border-left-color: var(--accent-yellow); }
        .block-item.is-cond { border-left-color: var(--accent-red); }
        
        .block-header {
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .block-children {
            padding-left: 16px;
            border-left: 2px dashed var(--block-border);
            display: flex; flex-direction: column; gap: 8px;
            margin-left: 8px;
        }

        .insert-target {
            background: transparent;
            border: 2px dashed var(--block-border);
            color: var(--text-muted);
            padding: 6px; text-align: center; border-radius: 6px;
            cursor: pointer; transition: all 0.2s; font-size: 0.9rem;
        }
        .insert-target:hover { border-color: var(--accent-yellow); color: var(--accent-yellow); }
        .insert-target.active {
            background: var(--target-glow);
            border-color: var(--accent-yellow);
            color: var(--text-light);
        }

        .running-highlight {
            box-shadow: 0 0 8px 2px var(--accent-green);
            border-color: var(--accent-green);
        }

        .stats-row {
            display: flex; justify-content: space-between;
            background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px;
            font-family: 'Mali';
        }

        /* Teacher Corner */
        .teacher-corner {
            margin: 0 5% 24px;
            background: #2a2015; /* slightly distinct from green board */
            border-radius: 12px;
            border: 1px solid #5a4025;
            overflow: hidden;
        }
        .teacher-corner summary {
            padding: 16px; cursor: pointer; font-weight: bold;
            font-family: 'Mali'; color: var(--accent-yellow);
            list-style: none; display: flex; justify-content: space-between;
        }
        .teacher-corner summary::-webkit-details-marker { display: none; }
        .teacher-corner summary::after { content: '▼'; }
        .teacher-corner[open] summary::after { content: '▲'; }
        .teacher-content { padding: 0 16px 16px; color: #f0e6d2; }
        .teacher-content h4 { color: var(--accent-blue); margin: 12px 0 4px; }
        .teacher-content ul { padding-left: 20px; margin-bottom: 8px; }

        /* Modal (Fallback for Alert) */
        #modalOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100;
            display: none; justify-content: center; align-items: center;
        }
        .modal-box {
            background: var(--board-bg); padding: 24px; border-radius: 16px;
            border: 2px solid var(--accent-yellow); max-width: 400px; text-align: center;
        }
        .stars-display { font-size: 2rem; color: var(--accent-yellow); margin: 12px 0; }

        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1 style="color: var(--accent-yellow);">🤖 หุ่นยนต์ครูน้อย</h1>
            <div id="totalStarsHeader" style="font-size: 0.9rem; color: var(--text-muted);">ดาวรวม: 0/18</div>
        </div>
        <div class="level-selector" id="levelSelector" role="group" aria-label="เลือกด่าน">
            <!-- Buttons rendered via JS -->
        </div>
    </header>

    <main>
        <!-- Left Panel: Game & Controls -->
        <section class="panel">
            <span class="concept-tag" id="lblConcept">แนวคิด: ลำดับ</span>
            <h2 id="lblTitle" class="mali-font">ด่าน 1: ก้าวแรก</h2>
            <p id="lblDesc">หุ่นยนต์ต้องเดินไปให้ถึงธง</p>

            <canvas id="gameCanvas" width="300" height="300" aria-label="แผนที่เกม"></canvas>

            <div class="controls-row">
                <button class="btn-primary" id="btnStart">▶️ เริ่มทำงาน</button>
                <button class="btn-secondary" id="btnReset">🔄 ตั้งใหม่</button>
                <button class="btn-secondary" id="btnSolution">💡 ดูเฉลย</button>
                <select id="selSpeed" aria-label="ความเร็ว">
                    <option value="500">ความเร็ว: ปกติ</option>
                    <option value="200">ความเร็ว: เร็ว</option>
                    <option value="0">ความเร็ว: ทันที</option>
                </select>
            </div>
            <div id="statusBox" class="status-box" aria-live="polite">รอรับคำสั่ง...</div>
        </section>

        <!-- Right Panel: Code Workspace -->
        <section class="panel">
            <h3 class="mali-font">แถบบล็อกคำสั่ง</h3>
            <div class="palette" id="blockPalette" role="toolbar" aria-label="แถบบล็อกคำสั่ง">
                <button class="block-btn" data-type="F">⬆️ เดินหน้า 1 ช่อง</button>
                <button class="block-btn" data-type="L">↩️ เลี้ยวซ้าย</button>
                <button class="block-btn" data-type="R">↪️ เลี้ยวขวา</button>
                <button class="block-btn" data-type="LOOP_N">🔁 วนซ้ำ...</button>
                <button class="block-btn" data-type="LOOP_FLAG" id="btnAdvanced1" style="display:none;">🏁 วนจนถึงธง</button>
                <button class="block-btn" data-type="IF_WALL" id="btnAdvanced2" style="display:none;">🧱 ถ้าข้างหน้าเป็นกำแพง</button>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 class="mali-font">โปรแกรมของคุณ</h3>
                <button class="btn-danger" id="btnClear">ล้างทั้งหมด</button>
            </div>
            
            <div class="workspace" id="workspaceArea">
                <!-- Blocks rendered via JS -->
            </div>

            <div class="stats-row">
                <span id="lblBlockCount">ใช้บล็อก: 0</span>
                <span id="lblPar" style="color: var(--accent-yellow);">เป้าหมาย 3 ดาว: ไม่เกิน X บล็อก</span>
            </div>
        </section>
    </main>

    <details class="teacher-corner">
        <summary>🍎 มุมครู: นำไปใช้ในห้องเรียน</summary>
        <div class="teacher-content" id="teacherContent">
            <!-- Content loaded dynamically -->
        </div>
    </details>

    <div id="modalOverlay">
        <div class="modal-box">
            <h2 id="modalTitle" class="mali-font">เยี่ยมมาก!</h2>
            <div class="stars-display" id="modalStars">⭐⭐⭐</div>
            <p id="modalMsg">คุณทำสำเร็จ</p>
            <div style="margin-top: 20px; display: flex; gap: 12px; justify-content: center;">
                <button class="btn-secondary" id="btnModalClose">ปิด</button>
                <button class="btn-primary" id="btnModalNext">ด่านถัดไป ➡️</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. GAME DATA & CONFIG ---
        const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]]; // 0:Up, 1:Right, 2:Down, 3:Left (Y goes down)
        
        const LEVELS = [
            {
                id: 1, concept: 'ลำดับขั้นตอน (Sequence)', title: 'ก้าวแรก',
                desc: 'หุ่นยนต์หันหน้าไปทางขวา วางบล็อกเดินหน้าให้ถึงธง',
                map: ['......','......','......','......','......','S..G..'],
                startX: 0, startY: 5, startDir: 1, par: 3,
                solution: [{type:'F'},{type:'F'},{type:'F'}],
                teacher: {
                    concept: 'การทำงานตามลำดับ (Sequence)',
                    q1: 'ถ้านักเรียนสลับลำดับบล็อก หุ่นยนต์จะไปถึงที่หมายหรือไม่? เพราะเหตุใด?',
                    q2: 'ในชีวิตประจำวัน มีกิจกรรมอะไรบ้างที่ต้องทำตามลำดับอย่างเคร่งครัด (เช่น การใส่รองเท้าถุงเท้า)'
                }
            },
            {
                id: 2, concept: 'ลำดับและการหมุน (Sequence)', title: 'เลี้ยวซ้ายขวา',
                desc: 'ระวังทิศทางให้ดี หุ่นยนต์เริ่มต้นหันหน้าขึ้นด้านบน',
                map: ['......','......','...G..','......','......','S.....'],
                startX: 0, startY: 5, startDir: 0, par: 7,
                solution: [{type:'F'},{type:'F'},{type:'F'},{type:'R'},{type:'F'},{type:'F'},{type:'F'}],
                teacher: {
                    concept: 'ทิศทางสัมพันธ์ (Relative Direction)',
                    q1: 'คำว่า "เลี้ยวซ้าย" ของหุ่นยนต์ ขึ้นอยู่กับอะไร? (มุมมองของหุ่นยนต์ ไม่ใช่มุมมองของเราหน้าจอ)',
                    q2: 'ให้นักเรียนลองจำลองตัวเองเป็นหุ่นยนต์แล้วเดินตามคำสั่งเพื่อฝึก Spatial Thinking'
                }
            },
            {
                id: 3, concept: 'การวนซ้ำ (Loop)', title: 'ขั้นบันได',
                desc: 'สังเกตรูปแบบที่ซ้ำกัน แล้วใช้บล็อก "วนซ้ำ" เพื่อลดจำนวนบล็อก',
                map: ['......','......','....G.','......','......','S.....'],
                startX: 0, startY: 5, startDir: 1, par: 6,
                solution: [
                    {type:'F'},
                    {type:'LOOP_N', times: 3, children: [{type:'L'},{type:'F'},{type:'R'},{type:'F'}]}
                ],
                teacher: {
                    concept: 'การรู้จำรูปแบบ (Pattern Recognition)',
                    q1: 'ในเส้นทางนี้ มีชุดคำสั่งใดที่ถูกเรียกใช้ซ้ำๆ กัน?',
                    q2: 'ข้อดีของการใช้บล็อกวนซ้ำ แทนการต่อบล็อกยาวๆ คืออะไร? (แก้โค้ดง่าย, อ่านง่าย)'
                }
            },
            {
                id: 4, concept: 'การวนซ้ำและสถานะ (Loop & State)', title: 'เก็บดาวให้ครบ',
                desc: 'เดินผ่านดาวเพื่อเก็บให้ครบ 3 ดวง แล้วจึงไปที่ธง',
                map: ['S..*..','G.....','......','*..*..','......','......'],
                startX: 0, startY: 0, startDir: 1, par: 7,
                solution: [
                    {type:'LOOP_N', times: 3, children: [{type:'F'},{type:'F'},{type:'F'},{type:'R'}]},
                    {type:'F'}, {type:'F'}
                ],
                teacher: {
                    concept: 'การทำงานร่วมกับการติดตามสถานะ',
                    q1: 'ทำไมเราจึงต้องออกจากลูป ก่อนที่จะเดินเข้าหาธง?',
                    q2: 'ให้นักเรียนลองเขียนโปรแกรมนี้โดยไม่ใช้ลูป แล้วเปรียบเทียบความยาวของโปรแกรม'
                }
            },
            {
                id: 5, concept: 'เงื่อนไข (Conditionals)', title: 'ทางตัน',
                desc: 'หุ่นยนต์มองไม่เห็นทางข้างหน้า ใช้บล็อกเงื่อนไข "ถ้าข้างหน้าเป็นกำแพง" ช่วยตัดสินใจ',
                map: ['......','.####.','.####.','.####.','.####.','S##G..'],
                startX: 0, startY: 5, startDir: 0, par: 4,
                solution: [
                    {type:'LOOP_FLAG', children: [
                        {type:'IF_WALL', children: [{type:'R'}]},
                        {type:'F'}
                    ]}
                ],
                teacher: {
                    concept: 'การตัดสินใจตามเงื่อนไข (Conditionals)',
                    q1: 'หากหุ่นยนต์ไม่เจอเงื่อนไข "ข้างหน้าเป็นกำแพง" หุ่นยนต์จะข้ามคำสั่งข้างในเงื่อนไขไปทำคำสั่งใดต่อ?',
                    q2: 'โค้ดชุดนี้สามารถนำไปใช้กับด่านที่มีขนาดเปลี่ยนไป (เช่น กำแพงยาวขึ้น) ได้หรือไม่? เพราะเหตุใด?'
                }
            },
            {
                id: 6, concept: 'ลูปซ้อนลูป (Nested Loops)', title: 'ทางงู',
                desc: 'ทางเดินคดเคี้ยวและยาวมาก ลองใช้ลูปซ้อนลูปเพื่อพิชิตด่านนี้',
                map: ['S....*','*.....','.....*','*.....','G.....','......'],
                startX: 0, startY: 0, startDir: 1, par: 11,
                solution: [
                    {type: 'LOOP_N', times: 2, children: [
                        {type: 'LOOP_N', times: 5, children: [{type: 'F'}]},
                        {type: 'R'}, {type: 'F'}, {type: 'R'},
                        {type: 'LOOP_N', times: 5, children: [{type: 'F'}]},
                        {type: 'L'}, {type: 'F'}, {type: 'L'}
                    ]}
                ],
                teacher: {
                    concept: 'ลูปซ้อนลูปและนามธรรม (Nested Loops & Abstraction)',
                    q1: 'การใช้ลูปซ้อนลูปช่วยลดจำนวนคำสั่งลงไปกี่บรรทัดเมื่อเทียบกับการเขียนตรงๆ?',
                    q2: 'อภิปราย: โปรแกรมที่สั้นที่สุด อาจไม่ใช่โปรแกรมที่อ่านเข้าใจง่ายที่สุดเสมอไป ความสมดุลอยู่ตรงไหน?'
                }
            }
        ];

        // --- 2. STATE MANAGEMENT ---
        let currentLevel = 1;
        let unlockedLevels = 1;
        let starData = {}; // { levelId: starsCount }
        let program = [];
        let activeTargetPath = []; // Array of indices, e.g. [0, 2] means program[0].children[2]
        
        // Storage Wrapper
        function loadStorage() {
            try {
                const save = localStorage.getItem('krunoi_save');
                if (save) {
                    const data = JSON.parse(save);
                    unlockedLevels = data.unlocked || 1;
                    starData = data.stars || {};
                }
            } catch (e) { console.warn('Storage not available', e); }
        }
        function saveStorage() {
            try {
                localStorage.setItem('krunoi_save', JSON.stringify({
                    unlocked: unlockedLevels,
                    stars: starData
                }));
            } catch (e) { console.warn('Storage full or blocked', e); }
        }

        // --- STREAMING_CHUNK:Building Workspace and AST Logic ---
        function generateId() { return Math.random().toString(36).substr(2, 9); }

        function countBlocks(ast) {
            let count = 0;
            for (const b of ast) {
                count++;
                if (b.children) count += countBlocks(b.children);
            }
            return count;
        }

        function deepCloneProgram(ast) {
            return JSON.parse(JSON.stringify(ast)).map(b => {
                b.id = generateId(); // Assign fresh IDs for rendering
                if(b.children) b.children = deepCloneProgram(b.children);
                return b;
            });
        }

        // Navigate AST using path array
        function getTargetArray(ast, path) {
            let current = ast;
            for (let i = 0; i < path.length; i++) {
                if (current[path[i]] && current[path[i]].children) {
                    current = current[path[i]].children;
                } else {
                    return null; // Invalid path
                }
            }
            return current;
        }

        // Add Block
        function addBlock(type) {
            const newBlock = { id: generateId(), type: type };
            if (type === 'LOOP_N') { newBlock.times = 2; newBlock.children = []; }
            if (type === 'LOOP_FLAG' || type === 'IF_WALL') { newBlock.children = []; }

            const targetArr = getTargetArray(program, activeTargetPath);
            if (targetArr) {
                targetArr.push(newBlock);
                updateWorkspace();
            }
        }

        // Delete Block
        function deleteBlock(pathArray) {
            const parentPath = pathArray.slice(0, -1);
            const index = pathArray[pathArray.length - 1];
            const targetArr = getTargetArray(program, parentPath);
            if(targetArr) {
                targetArr.splice(index, 1);
                // Reset insert target if we deleted its parent
                activeTargetPath = [];
                updateWorkspace();
            }
        }

        // --- 3. UI RENDERING ---
        
        function renderHeader() {
            const selector = document.getElementById('levelSelector');
            selector.innerHTML = '';
            let totalStars = 0;
            
            for (let i = 1; i <= 6; i++) {
                const btn = document.createElement('button');
                btn.className = `level-btn ${i <= unlockedLevels ? 'unlocked' : ''} ${i === currentLevel ? 'active' : ''}`;
                btn.textContent = i;
                btn.disabled = i > unlockedLevels;
                btn.onclick = () => loadLevel(i);
                selector.appendChild(btn);
                
                totalStars += (starData[i] || 0);
            }
            document.getElementById('totalStarsHeader').textContent = `ดาวรวม: ${totalStars}/18`;
        }

        function renderWorkspace() {
            const container = document.getElementById('workspaceArea');
            container.innerHTML = '';
            
            function buildDOM(ast, currentPath, parentEl) {
                if(ast.length === 0 && currentPath.length > 0) {
                     // Empty container placeholder
                }
                
                ast.forEach((block, index) => {
                    const blockPath = [...currentPath, index];
                    
                    const el = document.createElement('div');
                    el.className = 'block-item';
                    el.id = `block-${block.id}`;
                    if(block.type.startsWith('LOOP')) el.classList.add('is-loop');
                    if(block.type === 'IF_WALL') el.classList.add('is-cond');

                    const header = document.createElement('div');
                    header.className = 'block-header';
                    
                    // Title/Controls
                    const leftSide = document.createElement('div');
                    if (block.type === 'F') leftSide.textContent = '⬆️ เดินหน้า';
                    else if (block.type === 'L') leftSide.textContent = '↩️ เลี้ยวซ้าย';
                    else if (block.type === 'R') leftSide.textContent = '↪️ เลี้ยวขวา';
                    else if (block.type === 'IF_WALL') leftSide.textContent = '🧱 ถ้าข้างหน้าเป็นกำแพง ทำ:';
                    else if (block.type === 'LOOP_FLAG') leftSide.textContent = '🏁 วนซ้ำจนถึงธง ทำ:';
                    else if (block.type === 'LOOP_N') {
                        leftSide.textContent = '🔁 วนซ้ำ ';
                        const sel = document.createElement('select');
                        sel.ariaLabel = "จำนวนรอบ";
                        [2,3,4,5,6].forEach(n => {
                            const opt = document.createElement('option');
                            opt.value = n; opt.text = `${n} รอบ`;
                            if(n === block.times) opt.selected = true;
                            sel.appendChild(opt);
                        });
                        sel.onchange = (e) => { block.times = parseInt(e.target.value); };
                        leftSide.appendChild(sel);
                        leftSide.appendChild(document.createTextNode(' ทำ:'));
                    }

                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-danger';
                    delBtn.textContent = 'X';
                    delBtn.ariaLabel = "ลบบล็อก";
                    delBtn.onclick = () => deleteBlock(blockPath);

                    header.appendChild(leftSide);
                    header.appendChild(delBtn);
                    el.appendChild(header);

                    if (block.children) {
                        const childrenContainer = document.createElement('div');
                        childrenContainer.className = 'block-children';
                        buildDOM(block.children, blockPath, childrenContainer);
                        
                        // Insert Target Button for this container
                        const targetBtn = document.createElement('div');
                        const isTarget = JSON.stringify(activeTargetPath) === JSON.stringify(blockPath);
                        targetBtn.className = `insert-target ${isTarget ? 'active' : ''}`;
                        targetBtn.textContent = isTarget ? '📍 วางที่นี่' : '✏️ แทรกในนี้';
                        targetBtn.onclick = () => {
                            activeTargetPath = blockPath;
                            updateWorkspace();
                        };
                        childrenContainer.appendChild(targetBtn);
                        el.appendChild(childrenContainer);
                    }

                    parentEl.appendChild(el);
                });
            }

            buildDOM(program, [], container);

            // Root insert target
            const rootTarget = document.createElement('div');
            const isRootTarget = activeTargetPath.length === 0;
            rootTarget.className = `insert-target ${isRootTarget ? 'active' : ''}`;
            rootTarget.textContent = isRootTarget ? '📍 วางต่อท้ายตรงนี้' : '✏️ แทรกต่อท้ายโปรแกรมหลัก';
            rootTarget.onclick = () => { activeTargetPath = []; updateWorkspace(); };
            container.appendChild(rootTarget);

            // Stats
            const count = countBlocks(program);
            const par = LEVELS[currentLevel-1].par;
            document.getElementById('lblBlockCount').textContent = `ใช้บล็อก: ${count}`;
            document.getElementById('lblPar').textContent = `เป้าหมาย 3 ดาว: ไม่เกิน ${par} บล็อก`;
        }

        function updateWorkspace() {
            renderWorkspace();
        }

        // --- STREAMING_CHUNK:Simulator and Core Logic ---
        function runSimulator(prog, lvlData) {
            let state = {
                x: lvlData.startX, y: lvlData.startY, dir: lvlData.startDir,
                stars: [], stepCount: 0,
                status: 'RUNNING', msg: '', activeId: null
            };
            const history = [];
            const grid = lvlData.map;
            let isDone = false;
            
            // Total stars in map
            let totalStars = 0;
            for(let y=0; y<grid.length; y++) {
                for(let x=0; x<grid[y].length; x++) {
                    if(grid[y][x] === '*') totalStars++;
                }
            }

            // Helper checks
            const isWall = (tx, ty) => {
                if(tx < 0 || tx >= 6 || ty < 0 || ty >= 6) return true; // Bounds
                return grid[ty][tx] === '#';
            };
            const getNextPos = () => {
                return { x: state.x + DIRS[state.dir][0], y: state.y + DIRS[state.dir][1] };
            };

            // Recursive evaluator
            function evalBlock(block) {
                if(isDone) return;
                state.stepCount++;
                if(state.stepCount > 900) { state.status = 'FAIL'; state.msg = 'ทำงานเกินขีดจำกัด (Infinite Loop?)'; isDone = true; return; }
                
                if (block.type === 'F') {
                    const next = getNextPos();
                    if(isWall(next.x, next.y)) {
                        state.status = 'FAIL'; state.msg = 'ชนกำแพงหรือขอบแผนที่!'; isDone = true;
                        history.push({...state, activeId: block.id});
                        return;
                    }
                    state.x = next.x; state.y = next.y;
                    
                    // Star check
                    if (grid[state.y][state.x] === '*' && !state.stars.includes(`${state.x},${state.y}`)) {
                        state.stars.push(`${state.x},${state.y}`);
                    }
                    history.push({...state, activeId: block.id});
                
                } else if (block.type === 'L') {
                    state.dir = (state.dir + 3) % 4;
                    history.push({...state, activeId: block.id});
                
                } else if (block.type === 'R') {
                    state.dir = (state.dir + 1) % 4;
                    history.push({...state, activeId: block.id});
                
                } else if (block.type === 'LOOP_N') {
                    history.push({...state, activeId: block.id}); // Highlight loop block
                    for(let i=0; i<block.times; i++) {
                        if(isDone) break;
                        block.children.forEach(evalBlock);
                    }
                
                } else if (block.type === 'LOOP_FLAG') {
                    let guard = 0;
                    while(grid[state.y][state.x] !== 'G' && !isDone) {
                        guard++;
                        if(guard > 60) { state.status = 'FAIL'; state.msg = 'วนซ้ำนานเกินไป (เกิน 60 รอบ)'; isDone = true; break; }
                        history.push({...state, activeId: block.id});
                        block.children.forEach(evalBlock);
                    }
                
                } else if (block.type === 'IF_WALL') {
                    history.push({...state, activeId: block.id});
                    const next = getNextPos();
                    if(isWall(next.x, next.y)) {
                        block.children.forEach(evalBlock);
                    }
                }
            }

            // Initial State
            history.push({...state});

            try {
                if(prog.length === 0) {
                    state.status = 'FAIL'; state.msg = 'โปรแกรมว่างเปล่า';
                } else {
                    prog.forEach(evalBlock);
                    // Check End Condition
                    if (state.status === 'RUNNING') {
                        if (grid[state.y][state.x] === 'G') {
                            if (state.stars.length === totalStars) {
                                state.status = 'SUCCESS'; state.msg = 'สำเร็จ!';
                            } else {
                                state.status = 'FAIL'; state.msg = 'ถึงธงแล้ว แต่เก็บดาวไม่ครบ';
                            }
                        } else {
                            state.status = 'FAIL'; state.msg = 'โปรแกรมจบ แต่ยังไม่ถึงธง';
                        }
                    }
                }
            } catch(e) {
                state.status = 'FAIL'; state.msg = 'เกิดข้อผิดพลาดในการทำงาน';
            }
            
            history.push({...state, finalState: true, activeId: null});
            return history;
        }

        // --- STREAMING_CHUNK:Canvas Rendering and Animation ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let currentDrawState = null;
        let animationId = null;
        let isSimulating = false;

        function drawBoard(state, lvlData) {
            const cw = canvas.width;
            const ch = canvas.height;
            const cs = cw / 6; // Cell size
            
            ctx.clearRect(0, 0, cw, ch);

            // Draw Grid & Entities
            const grid = lvlData.map;
            for(let y=0; y<6; y++) {
                for(let x=0; x<6; x++) {
                    const char = grid[y][x];
                    
                    // Alternate grid pattern
                    ctx.fillStyle = (x+y)%2===0 ? '#274031' : '#1e3628';
                    ctx.fillRect(x*cs, y*cs, cs, cs);
                    
                    ctx.strokeStyle = '#466e57';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x*cs, y*cs, cs, cs);

                    if (char === '#') { // Wall
                        ctx.fillStyle = '#6e5646'; // Brown
                        ctx.fillRect(x*cs+2, y*cs+2, cs-4, cs-4);
                        ctx.strokeStyle = '#3e2c1e';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(x*cs+4, y*cs+4, cs-8, cs-8);
                    }
                    else if (char === 'G') { // Flag
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(x*cs + cs/2 - 2, y*cs + cs/4, 4, cs/2); // Pole
                        ctx.fillStyle = varColor('--accent-red');
                        ctx.beginPath();
                        ctx.moveTo(x*cs + cs/2 + 2, y*cs + cs/4);
                        ctx.lineTo(x*cs + cs - 4, y*cs + cs/3);
                        ctx.lineTo(x*cs + cs/2 + 2, y*cs + cs/2);
                        ctx.fill();
                    }
                    else if (char === '*') { // Star
                        // Only draw if not collected in current state
                        const isCollected = state && state.stars && state.stars.includes(`${x},${y}`);
                        if (!isCollected) {
                            drawStar(ctx, x*cs + cs/2, y*cs + cs/2, 5, cs/3, cs/6, varColor('--accent-yellow'));
                        }
                    }
                }
            }

            // Draw Robot
            if (state) {
                const rx = state.x * cs + cs/2;
                const ry = state.y * cs + cs/2;
                const dir = state.dir;

                ctx.save();
                ctx.translate(rx, ry);
                ctx.rotate(dir * Math.PI / 2); // 0=Up, 1=Right, 2=Down, 3=Left

                // Robot body (Green)
                ctx.fillStyle = varColor('--accent-green');
                ctx.beginPath();
                ctx.roundRect(-cs/3, -cs/3, cs/1.5, cs/1.5, 8);
                ctx.fill();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();

                // Robot Eyes (Looking 'Up' locally, which matches rotation)
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(-cs/8, -cs/6, cs/12, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(cs/8, -cs/6, cs/12, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(-cs/8, -cs/6 - 2, cs/24, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(cs/8, -cs/6 - 2, cs/24, 0, Math.PI*2); ctx.fill();
                
                ctx.restore();
            }
        }

        // Helper
        function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
        
        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius, color) {
            let rot = Math.PI / 2 * 3; let x = cx, y = cy; let step = Math.PI / spikes;
            ctx.beginPath(); ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius; y = cy + Math.sin(rot) * outerRadius; ctx.lineTo(x, y); rot += step;
                x = cx + Math.cos(rot) * innerRadius; y = cy + Math.sin(rot) * innerRadius; ctx.lineTo(x, y); rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius); ctx.closePath();
            ctx.lineWidth=2; ctx.strokeStyle='#b89914'; ctx.stroke();
            ctx.fillStyle = color; ctx.fill();
        }

        // --- STREAMING_CHUNK:Event Listeners & Main Flow ---
        
        function clearHighlights() {
            document.querySelectorAll('.running-highlight').forEach(el => el.classList.remove('running-highlight'));
        }

        async function playAnimation(history, lvlData) {
            isSimulating = true;
            disableControls(true);
            const statusBox = document.getElementById('statusBox');
            statusBox.className = 'status-box';
            statusBox.textContent = 'กำลังทำงาน...';

            const speedStr = document.getElementById('selSpeed').value;
            const delay = parseInt(speedStr);
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            const sleep = ms => new Promise(r => setTimeout(r, ms));

            for(let i=0; i<history.length; i++) {
                if(!isSimulating) break; // Interrupted by reset
                
                const state = history[i];
                currentDrawState = state;
                drawBoard(state, lvlData);

                // Highlight Block
                clearHighlights();
                if(state.activeId) {
                    const el = document.getElementById(`block-${state.activeId}`);
                    if(el) { el.classList.add('running-highlight'); el.scrollIntoView({behavior: 'smooth', block: 'nearest'}); }
                }

                // If immediate or reduced motion, skip delay except for very last frame
                if (delay > 0 && !prefersReducedMotion) {
                    await sleep(delay);
                }
            }

            if(isSimulating) { // Reached end normally
                const finalState = history[history.length-1];
                statusBox.textContent = finalState.msg;
                if(finalState.status === 'SUCCESS') {
                    statusBox.className = 'status-box status-success';
                    handleWin();
                } else {
                    statusBox.className = 'status-box status-error';
                }
            }
            
            clearHighlights();
            disableControls(false);
            isSimulating = false;
        }

        function handleWin() {
            const blocksUsed = countBlocks(program);
            const par = LEVELS[currentLevel-1].par;
            let starsEarned = 1;
            if (blocksUsed <= par) starsEarned = 3;
            else if (blocksUsed <= par + 3) starsEarned = 2;

            // Update Progress
            if ((starData[currentLevel] || 0) < starsEarned) {
                starData[currentLevel] = starsEarned;
            }
            if (currentLevel === unlockedLevels && currentLevel < 6) {
                unlockedLevels++;
            }
            saveStorage();
            renderHeader();

            // Show Modal
            const modal = document.getElementById('modalOverlay');
            document.getElementById('modalStars').textContent = '⭐'.repeat(starsEarned) + '⬜'.repeat(3-starsEarned);
            let msg = `คุณผ่านด่านด้วยการใช้ ${blocksUsed} บล็อก!`;
            if(starsEarned === 3) msg += '<br>สมบูรณ์แบบ! (3 ดาว)';
            else if(starsEarned === 2) msg += `<br>เยี่ยม! ลองลดให้เหลือ ${par} บล็อกเพื่อรับ 3 ดาว`;
            else msg += `<br>ผ่านแล้ว! แต่น่าจะทำให้สั้นลงได้อีกนะ (เป้าหมาย: ${par} บล็อก)`;
            document.getElementById('modalMsg').innerHTML = msg;
            
            document.getElementById('btnModalNext').style.display = currentLevel < 6 ? 'inline-block' : 'none';
            modal.style.display = 'flex';
        }

        function disableControls(disabled) {
            document.getElementById('btnStart').disabled = disabled;
            document.getElementById('btnClear').disabled = disabled;
            document.getElementById('btnSolution').disabled = disabled;
            document.querySelectorAll('.block-btn').forEach(b => b.disabled = disabled);
            document.querySelectorAll('.btn-danger').forEach(b => b.disabled = disabled); // delete buttons
        }

        function resetLevel() {
            isSimulating = false; // Stop animation loop
            const lvlData = LEVELS[currentLevel-1];
            currentDrawState = { x: lvlData.startX, y: lvlData.startY, dir: lvlData.startDir, stars: [] };
            drawBoard(currentDrawState, lvlData);
            clearHighlights();
            
            const statusBox = document.getElementById('statusBox');
            statusBox.className = 'status-box';
            statusBox.textContent = 'พร้อมรับคำสั่ง...';
            disableControls(false);
        }

        function loadLevel(lvlIndex) {
            currentLevel = lvlIndex;
            const lvlData = LEVELS[currentLevel-1];
            
            // Update UI Labels
            document.getElementById('lblConcept').textContent = `แนวคิด: ${lvlData.concept}`;
            document.getElementById('lblTitle').textContent = `ด่าน ${lvlData.id}: ${lvlData.title}`;
            document.getElementById('lblDesc').textContent = lvlData.desc;
            
            // Feature Flags for Advanced Blocks
            document.getElementById('btnAdvanced1').style.display = currentLevel >= 5 ? 'inline-block' : 'none';
            document.getElementById('btnAdvanced2').style.display = currentLevel >= 5 ? 'inline-block' : 'none';

            // Teacher Corner
            document.getElementById('teacherContent').innerHTML = `
                <h4>หัวข้อ: ${lvlData.teacher.concept}</h4>
                <ul>
                    <li>${lvlData.teacher.q1}</li>
                    <li>${lvlData.teacher.q2}</li>
                </ul>
            `;

            // Reset Program
            program = [];
            activeTargetPath = [];
            updateWorkspace();
            resetLevel();
            renderHeader(); // Highlight active button
        }

        // Event Bindings
        document.querySelectorAll('.block-btn').forEach(btn => {
            btn.onclick = () => addBlock(btn.dataset.type);
        });

        document.getElementById('btnClear').onclick = () => {
            program = []; activeTargetPath = []; updateWorkspace(); resetLevel();
        };

        document.getElementById('btnReset').onclick = resetLevel;

        document.getElementById('btnStart').onclick = () => {
            if(isSimulating) return;
            const lvlData = LEVELS[currentLevel-1];
            const history = runSimulator(program, lvlData);
            playAnimation(history, lvlData);
        };

        document.getElementById('btnSolution').onclick = () => {
            program = deepCloneProgram(LEVELS[currentLevel-1].solution);
            activeTargetPath = [];
            updateWorkspace();
            resetLevel();
        };

        // Modal bindings
        document.getElementById('btnModalClose').onclick = () => {
            document.getElementById('modalOverlay').style.display = 'none';
        };
        document.getElementById('btnModalNext').onclick = () => {
            document.getElementById('modalOverlay').style.display = 'none';
            if(currentLevel < 6) loadLevel(currentLevel + 1);
        };

        // Init
        window.onload = () => {
            loadStorage();
            loadLevel(currentLevel);
        };
    </script>
</body>
</html>
